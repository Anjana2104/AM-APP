trigger:
  branches:
    include:
      - none

resources:
  repositories:
    - repository: UT_INITIATIVE_EAM
      type: git
      name: ACCEL_UT_INITIATIVE/UT_INITIATIVE_EAM
      ref: refs/heads/main
    - repository: DevSecOps
      type: git
      name: Kalypso_DevOps_Plumbing/PipelineSupport
      ref: refs/tags/v1.0-security
    - repository: infra
      type: git
      name: ACCEL_UT_INITIATIVE/UT_INITIATIVE_INFRA
      ref: refs/heads/develop

variables:
  - group: acc-initiatives-var
  - group: keeper
  - group: initiative-chatbot
  - name: acrServiceConnection
    value: initiative-sc-acr
  - name: azureServiceConnection
    value: GCC_INITIATIVES_AI_APPS
  - name: subscriptionName
    value: Kalypso_Digital
  - name: acrLoginServer
    value: utaiappsacr.azurecr.io
  - name: backendRepo
    value: ut-eam-backend
  - name: frontendRepo
    value: ut-eam-frontend
  - name: imageTag
    value: v0.1.$(Build.BuildId)-UT_INITIATIVE_EAM
  - name: aksResourceGroup
    value: UT_AI_Apps
  - name: aksClusterName
    value: ut-ai-apps-aks
  - name: namespace
    value: ut-initiative-eam
  - name: KUBECONFIG
    value: $(Agent.TempDirectory)/kubeconfig
  # - name: DB_CLIENT
  #   value: sqlite3

stages:
