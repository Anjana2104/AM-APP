- stage: DeployToAKS
  displayName: Deploy To AKS
  dependsOn:
    - BuildAndPush # Changed to depend directly on BuildAndPush

  jobs:
  - job: Deploy
    displayName: Deploy EAM Application
    pool:
      name: ut-ai-ado-self-hosted-agent

    steps:
    - checkout: infra

    - task: KubectlInstaller@0
      displayName: Install Kubectl
      inputs:
        kubectlVersion: latest

    - task: AzureCLI@2
      displayName: Connect To AKS
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az account set --subscription "$(subscriptionName)"

          az aks get-credentials \
            --resource-group $(aksResourceGroup) \
            --name $(aksClusterName) \
            --file "$KUBECONFIG" \
            --admin \
            --overwrite-existing

          kubectl get nodes

    - script: |
        echo "Updating image tags..."

        sed -i "s|image:.*|image: $(acrLoginServer)/$(backendRepo):$(imageTag)|g" \
        $(Build.SourcesDirectory)/eam/deployment/backend-deployment.yaml

        sed -i "s|image:.*|image: $(acrLoginServer)/$(frontendRepo):$(imageTag)|g" \
        $(Build.SourcesDirectory)/eam/deployment/frontend-deployment.yaml

      displayName: Update Image Tags

    - script: |
        kubectl apply -f $(Build.SourcesDirectory)/eam/deployment/backend-deployment.yaml
        kubectl apply -f $(Build.SourcesDirectory)/eam/deployment/frontend-deployment.yaml
      displayName: Deploy To AKS

    - script: |
        # Added a 60s timeout threshold so validation doesn't freeze your entire pipeline if a pod locks up again
        kubectl rollout status deployment/eam-backend -n $(namespace) --timeout=60s
        kubectl rollout status deployment/eam-frontend -n $(namespace) --timeout=60s

        kubectl get deployments -n $(namespace)
        kubectl get pods -n $(namespace)
      displayName: Validate Deployment