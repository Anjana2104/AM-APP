- stage: BuildAndPush
  displayName: Build And Push Images
  dependsOn: [] # Changed from Security to run immediately
  jobs:
  - job: BuildAndPushJob
    pool:
      name: ut-ai-ado-self-hosted-agent
    steps:
    - checkout: self

    # Step: Build Backend 
    - task: Docker@2
      displayName: Build Backend Image
      inputs:
        containerRegistry: $(acrServiceConnection)
        repository: $(backendRepo)
        command: build
        Dockerfile: server/Dockerfile
        buildContext: server
        tags: |
          $(imageTag)

    # Step: Push Backend
    - task: Docker@2
      displayName: Push Backend Image
      inputs:
        containerRegistry: $(acrServiceConnection)
        repository: $(backendRepo)
        command: push
        tags: |
          $(imageTag)

    # Step: Build And Push Frontend 
    - task: Docker@2
      displayName: Build And Push Frontend
      inputs:
        containerRegistry: $(acrServiceConnection)
        repository: $(frontendRepo)
        command: buildAndPush
        Dockerfile: Dockerfile
        buildContext: .
        tags: |
          $(imageTag)

